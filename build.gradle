plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
    id "com.github.node-gradle.node" version "7.0.2"
}

ext {
    set('springAiVersion', '1.1.0')
}

group = 'com.sparta'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// build.gradle에 추가
bootJar {
    archiveFileName = 'app.jar'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Redisson (분산락)
    implementation 'org.redisson:redisson-spring-boot-starter:3.27.2'

    // Spring AI (1.0.0 GA 기준 아티팩트명 변경됨)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // Resilience4j
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // OAuth2 Client 라이브러리 추가
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // ★ 추가 — 낙관적 락 충돌 시 자동 재시도
    implementation 'org.springframework.retry:spring-retry:2.0.5'
    implementation 'org.springframework:spring-aspects'

    // Batch 처리
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // kafka
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // AWS S3
    implementation platform('software.amazon.awssdk:bom:2.25.0')
    implementation 'software.amazon.awssdk:s3'
}

def querydslDir = "build/generated/querydsl"

sourceSets {
    main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

clean.doLast {
    file(querydslDir).deleteDir()
}

tasks.named('test') {
	useJUnitPlatform()
}

// FE 빌드
node {
    version = '20.11.0'
    npmVersion = '10.2.4'
    download = true
    nodeProjectDir = file("${projectDir}/frontend")
}

// ★ npmInstall 은 플러그인이 자동 제공하므로 새로 만들지 않음
// ★ FE 빌드 태스크만 새로 정의 (이름을 npmBuild → buildFrontend 로)
task buildFrontend(type: com.github.gradle.node.npm.task.NpmTask) {
    dependsOn npmInstall          // 플러그인 기본 태스크에 의존
    args = ['run', 'build']
    inputs.dir("frontend/src")
    inputs.file("frontend/package.json")
    outputs.dir(file("frontend/dist"))
}

// 빌드된 정적 파일들을 Spring Boot의 static 폴더로 복사
task copyFrontendToStatic(type: Copy) {
    dependsOn buildFrontend

    // 기존에 남아있던 구버전 static 파일 삭제 (선택적 클린업)
    doFirst {
        delete "$projectDir/src/main/resources/static"
    }

    from "$projectDir/frontend/dist"
    into "$projectDir/src/main/resources/static"
}

// 3. Spring Boot가 리소스를 복사하기 전에 FE 빌드 및 복사 작업을 먼저 수행
processResources {
    dependsOn copyFrontendToStatic
}
