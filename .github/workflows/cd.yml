name: CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JAR 빌드
        run: ./gradlew bootJar --no-daemon

      - name: JAR 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar

  deploy-main:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./

      - name: EC2 1에 JAR 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_MAIN_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar"
          target: "/app/"

      - name: EC2 1 앱 재시작
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_MAIN_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart one-stop-main
            sleep 5
            sudo systemctl status one-stop-main --no-pager

  deploy-dummy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./

      - name: EC2 2에 JAR 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DUMMY_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar"
          target: "/app/"

      - name: EC2 2 앱 재시작
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DUMMY_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart one-stop-dummy
            sleep 5
            sudo systemctl status one-stop-dummy --no-pager
