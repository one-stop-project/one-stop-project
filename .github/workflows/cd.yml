name: CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JAR 빌드
        run: ./gradlew bootJar --no-daemon

      - name: JAR 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar

  deploy-main:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./

      - name: EC2 1 서비스 중지 및 구버전 JAR 제거
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_MAIN_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop one-stop-main
            sudo rm -f /app/app.jar

      - name: EC2 1에 JAR 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_MAIN_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar"
          target: "/app/"

      - name: EC2 1 앱 재시작 및 헬스체크
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_MAIN_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart one-stop-main
            echo "헬스체크 대기 중..."
            for i in $(seq 1 24); do
              if curl --max-time 5 -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
                echo "EC2 1 정상 기동 완료"
                exit 0
              fi
              echo "대기 중... ($i/24)"
              sleep 5
            done
            echo "EC2 1 헬스체크 실패"
            exit 1

  deploy-dummy:
    needs: deploy-main
    runs-on: ubuntu-latest
    steps:
      - name: JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./

      - name: EC2 2 서비스 중지 및 구버전 JAR 제거
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DUMMY_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop one-stop-dummy
            sudo rm -f /app/app.jar

      - name: EC2 2에 JAR 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DUMMY_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar"
          target: "/app/"

      - name: EC2 2 앱 재시작 및 헬스체크
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DUMMY_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart one-stop-dummy
            echo "헬스체크 대기 중..."
            for i in $(seq 1 24); do
              if curl --max-time 5 -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
                echo "EC2 2 정상 기동 완료"
                exit 0
              fi
              echo "대기 중... ($i/24)"
              sleep 5
            done
            echo "EC2 2 헬스체크 실패"
            exit 1
