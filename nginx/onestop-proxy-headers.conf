# Nginx proxy header snippet for Spring Boot OAuth2 behind HTTPS reverse proxy.
#
# 중요:
# - X-Forwarded-For는 $proxy_add_x_forwarded_for가 아니라 $remote_addr로 덮어쓴다.
# - 현재 ClientIpExtractor는 신뢰 프록시에서 온 XFF의 첫 번째 값을 사용하므로,
#   클라이언트가 보낸 XFF를 이어붙이면 IP spoofing으로 Rate Limit 우회가 가능하다.

location / {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}
