log_format upstream '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr';

upstream one-stop-backend {
server localhost:8080 max_fails=1 fail_timeout=10s;
server 10.0.22.194:8080 max_fails=1 fail_timeout=10s;
}

server {
listen 80;
server_name _;

access_log /var/log/nginx/access.log upstream;

root /var/www/frontend;
index index.html;

location ~ ^/(api|v3|images|swagger-ui|oauth2|login/oauth2)(/|$) {
    proxy_pass         http://one-stop-backend;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout    75s;
}

location /grafana/ {
    proxy_pass         http://10.0.29.202:3000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
}

location / {
    try_files $uri $uri/ /index.html;
}

}

