log_format upstream '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr';

upstream one-stop-backend {
    server localhost:8080 max_fails=1 fail_timeout=10s;
    server 10.0.22.194:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log upstream;

    root /var/www/frontend;
    index index.html;

    # 프론트 OAuth 콜백
    # 중요: 이 블록은 /oauth2/ 백엔드 프록시보다 먼저 exact match로 잡혀야 한다.
    location = /oauth2/callback {
        try_files /index.html =404;
    }

    # Spring Security OAuth2 시작 URL, Kakao redirect callback, API, Swagger 등은 백엔드
    location ~ ^/(api|v3|images|swagger-ui|oauth2|login/oauth2)(/|$) {
        proxy_pass http://one-stop-backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 중요:
        # $proxy_add_x_forwarded_for 사용 금지.
        # 현재 ClientIpExtractor가 trusted proxy에서 온 XFF의 첫 번째 값을 신뢰하므로
        # 클라이언트가 조작한 X-Forwarded-For가 이어붙으면 IP spoofing 우회 가능.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    location /grafana/ {
        proxy_pass http://10.0.29.202:3000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 프론트 SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}

