spring:
  config:
    import: "optional:classpath:prompts.yml"
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    openai:
      api-key: "test-api-key"
      base-url: "https://api.openai.com"
      chat:
        options:
          model: "gpt-4o-mini"

jwt:
  secret:
    key: ${JWT_SECRET_KEY:c3ByaW5nLWJvb3Qtc2VjdXJpdHktand0LXR1dG9yaWFsLXNlY3JldC1rZXktMjAyMw==}
  access-token-expiry: 15m
  refresh-token-expiry: 7d

app:
  cors:
    allowed-origins: "*"

resilience4j:
  circuitbreaker:
    instances:
      ai-review:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-size: 10
      ai-assistant:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
  timelimiter:
    instances:
      ai-review:
        timeout-duration: 30s
      ai-assistant:
        timeout-duration: 10s
  test-data:
    init: true

coupon:
  issue:
    # 쿠폰 발급 전략
    # decr: Redis DECR 기반 원자 차감
    # lua: Lua Script 기반 원자 처리
    # lock: Redis Lock 기반 처리
    strategy: decr

point:
  integrity:
    # 테스트 환경을 통과하기 위한 32바이트 이상의 임시(더미) 시크릿 키
    secret: "test_secret_key_for_point_integrity_validation_must_be_long"
