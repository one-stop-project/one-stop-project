spring:
  config:
    import: "optional:classpath:prompts.yml"
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    openai:
      api-key: "test-api-key"
      base-url: "https://api.openai.com"
      chat:
        options:
          model: "gpt-4o-mini"

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2


jwt:
  secret:
    key: ${JWT_SECRET_KEY:c3ByaW5nLWJvb3Qtc2VjdXJpdHktand0LXR1dG9yaWFsLXNlY3JldC1rZXktMjAyMw==}
  access-token-expiry: 15m
  refresh-token-expiry: 14d

app:
  cors:
    allowed-origins: "*"
  test-data:
    init: true
