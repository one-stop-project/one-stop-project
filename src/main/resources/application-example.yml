spring:
  application:
    name: one_stop
  config:
    import: "classpath:prompts.yml"

  datasource:
    url: jdbc:mysql://localhost:3306/one_stop_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: one_stop
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  # ── Kafka 설정 ──
  # OutboxEvent를 Kafka로 발행하기 위한 기본 설정
  # topic: payment.approved, key: partition_key, value: payload JSON
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      # OutboxEvent의 partitionKey와 payload를 문자열로 발행
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

    consumer:
      # 로컬 테스트용 Consumer Group
      group-id: one-stop-payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  # ── Spring AI (Gemini) 설정 ──
  # Gemini는 OpenAI 호환 엔드포인트를 제공해서 openai 스타터로 호출 가능
  ai:
    openai:
      # Google AI Studio에서 발급: https://aistudio.google.com/app/apikey
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        # base-url에 /openai가 포함돼 있어서 기본 경로와 겹치면 404 발생
        # /v1/chat/completions 대신 /chat/completions로 덮어씀
        completions-path: /chat/completions
        options:
          model: gemini-2.5-flash-lite

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
    # Base64 인코딩된 32자 이상의 랜덤 문자열
    # 생성 방법: echo -n "your-secret-key" | base64
  access-token-expiry: 15m
  refresh-token-expiry: 7d

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized

app:
  cors:
    # 허용할 프론트엔드 Origin을 입력하세요 (로컬: http://localhost:8080, 배포: 실제 도메인)
    allowed-origins: "http://localhost:8080"
  security:
    csp:
      # 로컬 개발 환경에서는 Swagger UI 렌더링을 위해 아래 정책을 그대로 사용하세요.
      # 배포 환경에서는 unsafe-inline / unsafe-eval 제거를 검토하세요.
      policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data: https://cdn.jsdelivr.net;"

# ── Circuit Breaker 설정 ──
# AI 서버가 죽거나 느릴 때 우리 서버 보호용
resilience4j:
  circuitbreaker:
    instances:
      ai-assistant:
        failure-rate-threshold: 50         # 실패율 50% 넘으면 회로 오픈
        minimum-number-of-calls: 10        # 최소 10번은 시도해야 통계 냄
        wait-duration-in-open-state: 30s   # 차단 후 30초 뒤 재시도 허용
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
      ai-review:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-size: 10
  timelimiter:
    instances:
      ai-assistant:
        timeout-duration: 10s   # 10초 넘으면 강제 타임아웃
      ai-review:
        timeout-duration: 30s   # 30초 넘으면 강제 타임아웃

point:
  integrity:
    # 최소 32바이트 이상의 랜덤 문자열 필수 (미달 시 앱 기동 실패)
    # 생성 예시: openssl rand -base64 32
    secret: ${POINT_INTEGRITY_SECRET}

coupon:
  issue:
    # 쿠폰 발급 전략
    # decr: Redis DECR 기반 원자 차감
    # lua: Lua Script 기반 원자 처리
    # lock: Redis Lock 기반 처리
    strategy: decr
