spring:
  application:
    name: one_stop
  config:
    import: "classpath:prompts.yml"

  datasource:
    url: jdbc:mysql://localhost:3306/one_stop_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: one_stop
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  # ── Kafka 설정 ──
  # OutboxEvent를 Kafka로 발행하기 위한 기본 설정
  # topic: payment.approved, key: partition_key, value: payload JSON
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      # OutboxEvent의 partitionKey와 payload를 문자열로 발행
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

    consumer:
      # 로컬 테스트용 Consumer Group
      group-id: one-stop-payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  # ── Spring AI (Gemini) 설정 ──
  # Gemini는 OpenAI 호환 엔드포인트를 제공해서 openai 스타터로 호출 가능
  ai:
    openai:
      # Google AI Studio에서 발급: https://aistudio.google.com/app/apikey
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        # base-url에 /openai가 포함돼 있어서 기본 경로와 겹치면 404 발생
        # /v1/chat/completions 대신 /chat/completions로 덮어씀
        completions-path: /chat/completions
        options:
          model: gemini-3.1-flash-lite

  # ── 파일 업로드(이미지) 한도 ──
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
    # Base64 인코딩된 32자 이상의 랜덤 문자열
    # 생성 방법: echo -n "your-secret-key" | base64
  access-token-expiry: 15m
  refresh-token-expiry: 7d

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized

# ── Gemini 더미 전용 API 키 (junghyun) ──
# S1(메인): GEMINI_DUMMY_API_KEY 설정 + DUMMY_SCHEDULER_ENABLED=true → 더미 스케줄러 포함 전체 실행
# S2(리드온리): GEMINI_DUMMY_API_KEY 미설정 시 GEMINI_API_KEY로 fallback (빈 생성용) + APP_SCHEDULER_ENABLED=false
gemini:
  dummy-api-key: ${GEMINI_DUMMY_API_KEY:${GEMINI_API_KEY}}

app:
  # ── 스케줄러 실행 서버 분리 ──
  # S1: APP_SCHEDULER_ENABLED 생략(기본 true) → 인기상품·키워드·구독·포인트 스케줄러 실행
  # S2: APP_SCHEDULER_ENABLED=false → 스케줄러 비활성, DB·Redis에서 읽기만 수행
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}
  cors:
    # 허용할 프론트엔드 Origin을 입력하세요 (로컬: http://localhost:8080, 배포: 실제 도메인)
    allowed-origins: "http://localhost:8080"
  image:
    # 배포(!local) 프로필 — S3 저장. 기본값을 빈 값으로 둬야 로컬(local) 프로필이 S3 env 없이 기동 가능
    # (배포에서 미설정이면 S3Client 빈 생성 시점에 즉시 실패)
    bucket: ${S3_BUCKET_NAME:}
    region: ${AWS_REGION:ap-northeast-2}
    # 로컬(local) 프로필 — 로컬 파일 저장. 미설정 시 기본값(local-dir=./uploads/images, url-prefix=/images) 사용
    # local-dir: ./uploads/images
    # url-prefix: /images
  security:
    csp:
      # 로컬 개발 환경에서는 Swagger UI 렌더링을 위해 아래 정책을 그대로 사용하세요.
      # 배포 환경에서는 unsafe-inline / unsafe-eval 제거를 검토하세요.
      policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data: https://cdn.jsdelivr.net;"

# ── Circuit Breaker 설정 ──
# AI 서버가 죽거나 느릴 때 우리 서버 보호용
resilience4j:
  circuitbreaker:
    instances:
      ai-assistant:
        failure-rate-threshold: 50         # 실패율 50% 넘으면 회로 오픈
        minimum-number-of-calls: 10        # 최소 10번은 시도해야 통계 냄
        wait-duration-in-open-state: 30s   # 차단 후 30초 뒤 재시도 허용
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
      ai-review:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-size: 10
  timelimiter:
    instances:
      ai-assistant:
        timeout-duration: 10s   # 10초 넘으면 강제 타임아웃
      ai-review:
        timeout-duration: 30s   # 30초 넘으면 강제 타임아웃

point:
  integrity:
    # 최소 32바이트 이상의 랜덤 문자열 필수 (미달 시 앱 기동 실패)
    # 생성 예시: openssl rand -base64 32
    secret: ${POINT_INTEGRITY_SECRET}

coupon:
  issue:
    # 쿠폰 발급 전략
    # decr: Redis DECR 기반 원자 차감
    # lua: Lua Script 기반 원자 처리
    # lock: Redis Lock 기반 처리
    strategy: decr

# ── 네이버 쇼핑 검색 API (AI 더미데이터 시드용) ──
# 네이버 개발자센터(https://developers.naver.com)에서 애플리케이션 등록 → '검색' → Client ID/Secret 발급
# 발급받은 값을 환경변수 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 로 설정하세요 (DB_PASSWORD 등과 동일 방식)
naver:
  api:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    base-url: https://openapi.naver.com/v1/search/shop.json
    default-sort: sim

# ── AI 더미데이터 시드 (네이버 키 있을 때만 동작) ──
# enabled=true 일 때만 스케줄러 빈이 뜨고, cron 시각에 1회 더미 상품을 채운다. 운영은 false 유지.
# 테스트/초기 적재는 cron을 임박한 시각으로(예: "0 */1 * * * *" 매분) 잠깐 바꿔 실행하면 된다.
dummy:
  scheduler:
    enabled: ${DUMMY_SCHEDULER_ENABLED:false}    # 더미 채울 때만 true (운영 안전 기본 false)
    cron: ${DUMMY_SCHEDULER_CRON:0 0 3 * * *}     # 매일 새벽 3시 (Asia/Seoul)
  seed:
    display: ${DUMMY_SEED_DISPLAY:100}            # 키워드당 네이버 검색 건수 (1~100)
    throttle-ms: ${DUMMY_SEED_THROTTLE_MS:4000}   # 카테고리 사이 대기(ms) — LLM 분당 한도(RPM) 보호
    default-image-url: ${DUMMY_SEED_DEFAULT_IMAGE_URL:/images/default-product.png}

# ── Slack 운영 알림 설정 ──
# OutboxEvent DEAD 전이 등 운영자가 확인해야 하는 이벤트를 Slack 채널로 알림
# Webhook URL은 보안 값이므로 Git에 커밋하지 않고 환경변수로 주입
# 로컬 기본값은 false이며, 알림 테스트 또는 운영 환경에서만 true로 변경
slack:
  alert:
    enabled: false
    webhook-url: ${SLACK_ALERT_WEBHOOK_URL:}
